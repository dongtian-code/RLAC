---
name: "SLURM"
partition: "allgpu"          # allgpu (requeue) | comgpu/compgpu (cancel) | psgpu
job-name: "RLAC-boxpushing-20M-allgpu"
num_parallel_jobs: 4         # 4 array tasks (one rep each), all at once
ntasks: 1
cpus-per-task: 32            # Maxwell is select/linear, so the job gets the whole
                             # node (192 cores) anyway; this is the rep's slice
mem: 128000                  # MB for ONE rep: the 20M-transition buffer (~5.4 GB),
                             # a transient copy while a checkpoint is pickled, JAX,
                             # 4 sims. The node has 718 GB.
time: 4320                   # minutes (72 h). Generous on purpose -- preemption is
                             # handled by requeue; ~4000 iterations are left (~8-9 h).
# CONTINUES the runs of configs/cw2/boxpushing_online_comgpu_20M.yml, which lost
# its H200 nodes on comgpu (25.Sep evening). allgpu REQUEUES a preempted job:
# Slurm brings the same array task back by itself, so on a signal every rep just
# checkpoints and quiesces/exits and the requeued job resumes. No self-resubmission.
preemption_mode: requeue
auto_resume_from_latest_checkpoint: true
resume_dir_name: "resume"

# One H200 NVL per node (max-exflg0[36-51]), one rep per node: 4 array tasks.
num_gpus: 1
reps_per_gpu: 1
scheduler: horeka

sbatch_args:
  requeue: ""                # lets Slurm recover failures before Python starts (node loss)
  signal: "B:USR1@300"       # 300 s of warning before the wall-time limit
  constraint: "GPUx1&H200"   # H200-NVL-141GB x1 nodes only
sh_lines:
  - "unset LD_PRELOAD"       # drop the login node's VirtualGL libvglfaker/libdlfaker preloads
  # MPRL_GPU_ENV_AUTO_SELECT MUST stay 0: with 1 it ignores CONDA_PREFIX and
  # probes dt_rl's torch environments, which is what produced "No module named 'jax'".
  - "export MPRL_GPU_ENV_AUTO_SELECT=0"
  - "export CONDA_PREFIX=/gpfs/petra3/scratch/dongtian/miniconda3/envs/rlac_env"
  - 'export PATH="$CONDA_PREFIX/bin:$PATH"'
  # Prefer the ptxas from this env's own nvidia-cuda-nvcc-cu12 wheel over the
  # node's /usr/local/cuda, whose version differs from node to node on Maxwell
  # ("ptxas too old"). Never fails the job if the wheel is missing.
  - 'PTXAS_BIN="$(ls -d "$CONDA_PREFIX"/lib/python*/site-packages/nvidia/cuda_nvcc/bin 2>/dev/null | head -1)"; if [ -x "$PTXAS_BIN/ptxas" ]; then export PATH="$PTXAS_BIN:$PATH"; echo "[slurm] ptxas: $PTXAS_BIN"; else echo "[slurm] WARNING: no nvidia-cuda-nvcc-cu12 ptxas in $CONDA_PREFIX; XLA will use the node CUDA and may fail with \"ptxas too old\""; fi'
  - "export MUJOCO_GL=egl"
  # envs/box_pushing_utils.py rewrites fancy_gym's MuJoCo-2 model XMLs into a
  # content-addressed cache the first time an env is built (the installed
  # fancy_gym stays untouched). Safe to share across reps: the build is atomic.
  - "export FANCY_GYM_ASSET_CACHE_DIR=/gpfs/petra3/scratch/dongtian/fancy_gym_mujoco3_assets"
  # 32 cores per rep. Without this each JAX process sizes its thread pool from
  # the node's full core count and the 4 reps oversubscribe each other. The four
  # BoxPushing sims a rep steps per online step run in-process, one after another.
  - "export OMP_NUM_THREADS=16"

experiment_copy_src: "../"
experiment_copy_auto_dst: "/gpfs/petra3/scratch/dongtian/CODE_COPY_RLAC/"

---
# ---- The document below is boxpushing_online_comgpu_20M.yml's, VERBATIM except
# ---- reps_per_job/reps_in_parallel: name, scope, seeds, iterations and params
# ---- decide the run directories and the checkpoint fingerprint, so changing
# ---- any of them would silently restart the runs instead of continuing them.
name: "RLAC-boxpushing-20M-comgpu"

# 20M environment samples at the SAME compute as the 5M launch
# (boxpushing_online_comgpu.yml): still 5M gradient updates, but now one per
# 4 new samples instead of one per sample. Fresh lineage -- the 5M comgpu runs
# were stopped on 25.Sep and nothing is resumed from them.
resume_scope_name: "boxpushing_randinit_20M_4envs_comgpu_25.Sep.2026"

# The standard config, 4 seeds = 4 runs, packed into ONE Slurm job on one 4-GPU
# node. cw2 unfolds repetitions as _rep_idx 0..3 and prepare_rep_configs turns
# that into seed = seed + _rep_idx, so the seeds are 0,1,2,3 (rep_00..rep_03).
seed: 0
repetitions: 4
reps_per_job: 1               # allgpu continuation: one rep per single-GPU node
reps_in_parallel: 1           # (not part of the checkpoint fingerprint)

# iterations = online_steps / chunk_size = 20_000_000 / 4_000. chunk_size counts
# ENVIRONMENT samples (an online step adds num_train_envs = 4 of them), so one
# chunk is 1000 online steps / 1000 gradient updates / 4000 env steps, several
# seconds on an H200. It has to stay short: a rep only acts on a preemption
# signal at the end of a chunk, and SIGKILL follows SIGTERM after 30 s.
iterations: &iterations 5000
num_checkpoints: 50          # every 100 chunks = 400k env samples (~12 min). A
                             # checkpoint carries the whole buffer (~5.4 GB per rep),
                             # hence the sparser cadence; at most that much is redone
                             # after a preemption.
overwrite_checkpoints: true

# Shared with the other RLAC launches: the replacement job re-submits the
# sbatch.sh inside its own code copy, not <path>/sbatch.sh, and every marker
# under <path>/.preemption is keyed by the Slurm job id.
path: "/gpfs/petra3/scratch/dongtian/rlac_exp_result"

auto_resume_from_latest_checkpoint: true
resume_dir_name: "resume"

# NOTE: `group` does NOT control the checkpoint lineage while `resume_scope_name`
# above is set -- main_cw2.py::_resume_scope_name reads that key first. Kept
# under 64 characters: RLAC also tags the run with it (log_utils.setup_wandb).
wandb:
  project: "[rlac online]boxpushing"
  group: "[rlac] boxpushing randinit dense 20M, 4envs, comgpu 250926"
  entity: null

params:
  # fancy_gym's BoxPushing, made WITHOUT importing fancy_gym: its package
  # __init__ subclasses gymnasium.wrappers.EnvCompatibility, removed in
  # gymnasium 1.0, so `import fancy_gym` cannot run on this repo's gymnasium 1.1
  # / mujoco 3.3 stack. envs/box_pushing_utils.py loads the env module in
  # isolation instead and rewrites the MuJoCo-2-only bits of its model XML. The
  # only install needed (note --no-deps, it pins mujoco==2.3.3):
  #   pip install --no-deps "git+https://github.com/DongTian95/fancy_gymnasium.git@dt_branch"
  # or `RLAC_WITH_BOXPUSHING=1 bash conda_env.sh`.
  #
  # "RandomInit" redraws the box's starting pose every reset on top of the goal
  # pose, i.e. the full task distribution rather than one fixed instance.
  # "Dense" is the shaped reward. Episodes are a fixed 100 steps and the step
  # counter is the first observation element, so the cut-off stays Markovian.
  env_name: "fancy/BoxPushingRandomInitDense-v0"

  offline_steps: 0            # must stay 0 -- there is no offline data for BoxPushing
  online_steps: 20000000      # environment samples
  buffer_size: 20000000       # full history (Dong, 25.Sep), SPLIT across the per-env
                              # buffers (5M each): sample_sequence reads action chunks
                              # out of consecutive slots, so each env needs its own
                              # contiguous region (utils/datasets.py). ~5.4 GB per rep
                              # in memory and in every checkpoint.
  chunk_size: 4000            # see `iterations` above
  log_interval: 5000          # env samples, as the 5M launch
  eval_interval: 20000        # env samples, as the 5M launch (and MetaWorld)
  save_interval: -1
  start_training: 5000        # random actions until the buffer has this many transitions

  # Four independent copies of the env, stepped once each per online step, so a
  # step collects 4 environment samples.
  num_train_envs: 4

  # utd_ratio is gradient steps per ONLINE STEP, and an online step collects
  # num_train_envs = 4 samples -- so 1 here is ONE update per 4 environment
  # samples. Over 20M samples that is 5M updates, exactly the compute of the 5M
  # launch (utd_ratio 4 there = one update per sample). SimbaV2's matching config
  # keeps its own 10M updates the same way (updates_per_interaction_step: 2).
  utd_ratio: 1
  discount: 0.99              # NOTE: SimbaV2 derives gamma from the episode length
                              # ((100/5-1)/(100/5) = 0.95) rather than fixing it, so
                              # the two methods do NOT share a discount here -- they
                              # did on MetaWorld's 500-step episodes, where that
                              # heuristic also lands on 0.99. Report it alongside.

  eval_episodes: 20
  video_episodes: 0
  video_frame_skip: 3

  # Unused without a dataset, left at defaults.
  dataset_proportion: 1.0
  dataset_replace_interval: 1000
  ogbench_dataset_dir: null

  horizon_length: 5           # action-chunk length, as on MetaWorld. 5% of a
                              # BoxPushing episode against 1% of a MetaWorld one.
  sparse: false
  save_all_online_states: false   # rejected outright at num_train_envs > 1: it
                                  # records a single env stream

  # The standard agent: agents/acfql.py's get_config() defaults, i.e. actor and
  # critic both (512,)*4 and num_qs 2 -- what the MetaWorld runs used. No sweep.
  agent:
    actor_type: "best-of-n"
    agent_name: "acfql"
    lr: 0.0003
    batch_size: 256
    actor_num_samples: 32     # only read when actor_type == "best-of-n"

# Not a sweep: a single entry, only so that the experiment name -- and with it
# the W&B run name "<task>_sd<seed>" -- carries the task the same way the
# MetaWorld launches' names do.
list:
  env_name: ["fancy/BoxPushingRandomInitDense-v0"]
