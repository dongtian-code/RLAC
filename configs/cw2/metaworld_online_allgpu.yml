---
name: "SLURM"
partition: "psgpu"
job-name: "RLAC-metaworld"
num_parallel_jobs: 50
ntasks: 1
cpus-per-task: 8
mem-per-cpu: 8000
time: 5000

preemption_mode: requeue
# No `gres: "gpu:1"` here: Maxwell does not register GPUs as a generic
# resource, so sbatch rejects it outright ("Invalid generic resource (gres)
# specification"). The GPU partitions hand out whole nodes exclusively, so a
# job gets the node's GPUs without asking for them.
sbatch_args:
  requeue: ""
  signal: "B:USR1@300"
  constraint: "GPUx1&A100"

# cw2 only emits a `source activate ...` line when the SLURM section sets
# `venv`, so the environment has to be set up here. Two things matter:
#
#   * MPRL_GPU_ENV_AUTO_SELECT=0 -- cw2's gpu_env_selector.sh runs AFTER these
#     lines and, when that variable is 1 (it is exported from the login shell
#     for another project), ignores CONDA_PREFIX entirely and probes its own
#     candidate list, which defaults to policy_chunking_transformer_*. Those
#     are torch envs with no jax, which is what caused the
#     "No module named 'jax'" crashes. With it set to 0 the selector takes its
#     `elif [ -n "$CONDA_PREFIX" ]` branch and points MPRL_PYTHON_BIN at the
#     env activated just below.
#   * the conda activate itself, by absolute path, because conda is not
#     necessarily on PATH in the job.
sh_lines:
  - "unset LD_PRELOAD"
  - "export MPRL_GPU_ENV_AUTO_SELECT=0"
  - "export CONDA_PREFIX=/gpfs/petra3/scratch/dongtian/miniconda3/envs/rlac_env"
  - 'export PATH="$CONDA_PREFIX/bin:$PATH"'
  - "export MUJOCO_GL=egl"

experiment_copy_src: "../"
experiment_copy_auto_dst: "/gpfs/petra3/scratch/dongtian/CODE_COPY/"

---
name: "RLAC-metaworld"

# Single seed per task, all 50 ML1 tasks (see the `grid.env_name` list below) --
# repetitions=1 means each grid point (task) gets exactly one seed.
repetitions: 1
reps_per_job: 1
reps_in_parallel: 1

# MetaWorld has no offline dataset, so offline_steps must be 0 (pure online) --
# see envs/metaworld_utils.py and RLACExperiment.initialize()'s no-dataset branch.
# iterations = ceil(online_steps / chunk_size) = 5_000_000 / 5_000 = 1000.
iterations: &iterations 1000
num_checkpoints: 100         # a resume checkpoint every iterations/num_checkpoints = 10 chunks
overwrite_checkpoints: true

# Keep this separate from the other project's mprl_exp_result: cw2 derives
# `slurm_log` (<path>/slurmlog) and `slurm_output` (<path>/sbatch.sh) from `path`
# (cw_slurm.py:_complete_optionals), so two projects sharing a `path` overwrite
# each other's sbatch.sh on submit and interleave their slurm logs.
path: "/gpfs/petra3/scratch/dongtian/rlac_exp_result"

auto_resume_from_latest_checkpoint: true
resume_dir_name: "resume"

wandb:
  project: "[rlac online]metaworld"
  group: "[rlac developing] smoke test, all 1 seed test"
  entity: null

params:
  # Task ids stay in this repo's "metaworld/<task>-v2" spelling;
  # envs/metaworld_utils.py normalises them to MetaWorld 3.x's "<task>-v3" and
  # makes them via the "Meta-World/goal_observable" gymnasium id. The only
  # install needed is:
  #   pip install "git+https://github.com/dongtian-code/Metaworld.git@dt_branch"
  # (fancy_gym is no longer used -- it is stuck on gymnasium 0.29 / mujoco 2.3.3).
  env_name: "metaworld/reach-v2"

  offline_steps: 0            # must stay 0 -- there is no offline data for MetaWorld
  online_steps: 5000000
  buffer_size: 5000000        # empty buffer at start, no offline data to seed it from
  chunk_size: &chunk_size 5000
  log_interval: *chunk_size
  eval_interval: 20000
  save_interval: -1
  start_training: 5000        # random actions until the buffer has this many transitions

  utd_ratio: 1
  discount: 0.99

  eval_episodes: 20
  video_episodes: 0
  video_frame_skip: 3

  # Unused for MetaWorld (no dataset), left at defaults.
  dataset_proportion: 1.0
  dataset_replace_interval: 1000
  ogbench_dataset_dir: null

  horizon_length: 5
  sparse: false
  save_all_online_states: false   # MetaWorld's env has no get_state(); leave this off

  agent:
    actor_type: "best-of-n"
    agent_name: "acfql"
    lr: 0.0003
    batch_size: 256
    actor_num_samples: 32     # only read when actor_type == "best-of-n"

# cw2 takes the cartesian product over all grid entries (itertools.product in
# cw_config/conf_unfolder.py:params_combine), so this is
# len(env_name) x len(agent.actor_type) jobs, with the grid values appended to
# each run's name. The two actor types are the two branches of
# acfql.py:sample_actions -- "distill-ddpg" uses the one-step distilled actor,
# "best-of-n" samples actor_num_samples flow actions and keeps the argmax-Q one
# (noticeably slower per env step and per eval).
grid:
  env_name: [
    "metaworld/assembly-v2",
    "metaworld/basketball-v2",
    "metaworld/bin-picking-v2",
    "metaworld/box-close-v2",
