---
name: "SLURM"
partition: "allgpu"          # allgpu (requeue) | comgpu/compgpu (cancel) | psgpu
job-name: "RLAC-metaworld-rerun"     # squeue label; was "RLAC-metaworld-allgpu"
num_parallel_jobs: 120       # Array throttle. With num_gpus=auto this is NOT one
                             # array: cw2 submits one per GPU-size group and
                             # _auto_gpu_group_throttles splits this number across
                             # them in proportion to group size, emitting
                             # "--array=<indices>%<share>" each. 250 runs expand to
                             # ~107 array tasks, so 120 leaves them unthrottled and
                             # the real limit becomes allgpu's own queued-job cap.
                             # To change it on an already-submitted launch there is
                             # no need to cancel:
                             #   scontrol update JobId=<array job id> ArrayTaskThrottle=120
                             # applied to each of the group arrays.
ntasks: 1
cpus-per-task: 64            # num_gpus=auto OVERWRITES this per array task with
                             # gpu_count * reps_per_gpu * cpus_per_rep, where
                             # cpus_per_rep is derived from THIS value:
                             # 64 / (max(auto_gpu_node_counts) * reps_per_gpu) = 64/4 = 16.
#
# Deliberately NO `cpus_per_rep:` key, even though the dt_rl template has one.
# Setting it flips HOREKAAffinityGPUDistributingLocalScheduler.__init__ from its
# self-adjusting branch to a hard assert:
#     required = cpus_per_rep * queue_elements     # 16 * 4 = 64
#     assert required <= len(os.sched_getaffinity(0))
# With num_gpus=auto, queue_elements comes from the GPUs detected on the node at
# RUNTIME, so if the cgroup hands back even one CPU fewer than --cpus-per-task
# asked for, every rep on that node dies in the first second. Leaving the key out
# takes the other branch instead:
#     usable = min(cpus-per-task * ntasks, len(allowed_cpus))
#     cpus_per_rep = usable // queue_elements
# which yields the same 16 when the allocation is as requested, and degrades to a
# smaller slice instead of crashing when it is not.
mem-per-cpu: 1000            # per-CPU, so memory scales with the group's node size:
                             # GPUx1 -> 16 cpus -> 16 GB, GPUx4 -> 64 cpus -> 64 GB.
                             # A flat `mem:` would hand a 1-GPU node running 1 rep
                             # the same budget as a 4-GPU node running 4. cw2 rejects
                             # setting both mem and mem-per-cpu.
                             # RLAC keeps its full 5M history (buffer_size below):
                             # ~2 GB of replay per rep, and a checkpoint transiently
                             # doubles that, so 16 GB/rep has ~2x headroom. Raise this
                             # if a rep is ever OOM-killed; do not raise it "just in
                             # case", an over-large request only delays scheduling.
time: 4320                   # minutes (72 h). Generous on purpose -- preemption is
                             # handled by requeue, so a long wall limit costs nothing.

# allgpu REQUEUES a preempted job: Slurm brings the same array task back by
# itself. So unlike the comgpu config there is no self-resubmission, no
# checkpoint-ready barrier and no .disable_preemption_resubmit escape hatch --
# on SIGUSR1 every rep just checkpoints and quiesces, and the requeued job picks
# the checkpoints back up.
preemption_mode: requeue
auto_resume_from_latest_checkpoint: true
resume_dir_name: "resume"
# No `exclude_current_node_on_resubmit` here even though the dt_rl template
# carries one: it is only consulted on the cancel-mode self-resubmission path
# (main_cw2.py::_replacement_exclude_nodes). Under requeue, Slurm chooses the
# node, so the key would be silently inert.

# Let cw2 size each array task to whatever GPU nodes are actually idle at submit
# time, instead of pinning one node shape. It queries idle nodes per GPU count,
# packs runs into the largest nodes first (4 -> 2 -> 1), and balances whatever is
# left over across node sizes.
#
# Two things this forbids, both enforced by cw2:
#   * `gres`/`gpus`/`gpus-per-node`/`gpus-per-task` in sbatch_args (ConfigKeyError);
#   * a hand-written `constraint` -- auto OVERWRITES sbatch_args["constraint"]
#     with "GPUx{n}&(<auto_gpu_models>)" per group. Restrict models with
#     `auto_gpu_models` below, never with `constraint`.
num_gpus: auto

# Keep the old Pascal cards out of the pool. Measured on the 14.Sep launch, same
# config, same 1000 iterations:
#     A100-class node   30.7 s/it  ->  ~8 h per run
#     P100 node        178.8 s/it  ->  ~50 h per run
# a 6x spread decided purely by which card the task landed on. P100 (compute
# capability 6.0) also forces XLA off the bundled ptxas and onto the driver's JIT
# ("ptxas does not support CC 6.0"), which is the slow path. Since a sweep is only
# finished when its SLOWEST run finishes, the extra 46 P100 nodes buy nothing.
#
# cw2 turns this into the Slurm constraint "GPUx{n}&(A100|H100|...)", and only
# nodes carrying one of these features are considered idle when packing.
#
# Capacity on allgpu (sinfo -p allgpu -N -o '%f'): A100 65, V100 54, H200 16,
# H100 6, RTX6000 5, L40S 5, A6000 4, RTX8000 2 = ~157 nodes. V100 is compute
# capability 7.0, so it does NOT hit the CC 6.0 ptxas fallback that makes P100 the
# slow path -- it is in for the extra 54 nodes. The single generic "V100" feature
# covers all of them (V100-SXM2-32GB 34 + V100-PCIE-32GB 13 + V100S-PCIE-32GB 7),
# so the variants do not need listing.
#
# P100 (46 nodes) is the only family deliberately excluded.
auto_gpu_models: ["A100", "V100", "H100", "H200", "L40S", "A6000", "RTX6000", "RTX8000"]
auto_gpu_node_counts: [1, 2, 4]
auto_gpu_fallback_count: 4          # must appear in auto_gpu_node_counts
auto_gpu_subtract_pending_priority: true   # reserve matching pending Priority jobs
                                           # before claiming idle nodes
reps_per_gpu: 1                     # one run per GPU -- never two on a device
scheduler: horeka

sbatch_args:
  requeue: ""                # lets Slurm recover failures before Python starts (node loss)
  signal: "B:USR1@300"       # 300 s of grace; main_cw2.py checkpoints on USR1

sh_lines:
  - "unset LD_PRELOAD"       # drop the login node's VirtualGL libvglfaker/libdlfaker preloads
  # MPRL_GPU_ENV_AUTO_SELECT MUST stay 0 here. The dt_rl config sets it to 1 with
  # MPRL_GPU_ENV_CANDIDATES=policy_chunking_transformer_* -- those are that
  # project's torch environments. cw2's gpu_env_selector.sh runs AFTER these
  # lines, and with AUTO_SELECT=1 it ignores CONDA_PREFIX and probes that
  # candidate list, which is what produced "No module named 'jax'". With 0 it
  # takes its `elif [ -n "$CONDA_PREFIX" ]` branch and uses the env below.
  - "export MPRL_GPU_ENV_AUTO_SELECT=0"
  - "export CONDA_PREFIX=/gpfs/petra3/scratch/dongtian/miniconda3/envs/rlac_env"
  - 'export PATH="$CONDA_PREFIX/bin:$PATH"'
  # XLA looks for an external `ptxas` on PATH and otherwise takes the node's
  # /usr/local/cuda/bin/ptxas, whose version differs from node to node on Maxwell.
  # Where it is older than what jaxlib 0.6 emits, XLA reports
  #     UNIMPLEMENTED: /usr/local/cuda/bin/ptxas ptxas too old
  # -- which RLAC survives (it surfaces in the redzone-allocator autotuning path,
  # which tolerates failure and falls back to the driver JIT) but SimbaV2 does not:
  # it hits the same condition while compiling the agent's networks, where it is
  # raised as XlaRuntimeError and kills the rep seconds after launch. Observed on
  # max-exflg007..024 and max-p3ag005..008 while max-exflg029/030 were fine, i.e.
  # it tracks the node's CUDA install, NOT the GPU model -- auto_gpu_models cannot
  # fix it. Prefer the ptxas that ships in this env's own nvidia-cuda-nvcc-cu12
  # wheel, which matches jaxlib by construction. Never fails the job: if the wheel
  # is missing it says so and leaves PATH alone.
  - 'PTXAS_BIN="$(ls -d "$CONDA_PREFIX"/lib/python*/site-packages/nvidia/cuda_nvcc/bin 2>/dev/null | head -1)"; if [ -x "$PTXAS_BIN/ptxas" ]; then export PATH="$PTXAS_BIN:$PATH"; echo "[slurm] ptxas: $PTXAS_BIN"; else echo "[slurm] WARNING: no nvidia-cuda-nvcc-cu12 ptxas in $CONDA_PREFIX; XLA will use the node CUDA and may fail with \"ptxas too old\""; fi'
  - "export MUJOCO_GL=egl"
  # cpus_per_rep is 16, and up to 4 reps share a node. Without this each JAX
  # process sizes its thread pool from the node's full core count and they
  # oversubscribe each other.
  - "export OMP_NUM_THREADS=8"

experiment_copy_src: "../"
experiment_copy_auto_dst: "/gpfs/petra3/scratch/dongtian/CODE_COPY_RLAC/"

---
name: "RLAC-metaworld-allgpu"

# RE-RUN LAUNCH (24.Sep.2026). The 14.Sep launch (commits 44ea6ce/ca283c5, same
# params: 50 tasks x seeds 0/2/4/6/8, scope
# "metaworld_randinit_lastframe_14.Sep.2026b") never produced a W&B run for 41
# of its 250 runs. For 40 of them, the 8 tasks below, that is a code bug:
# envs/env_utils.py::make_env_and_datasets tested the D4RL Adroit substrings
# ('door', 'hammer', 'pen' as in drawer-/faucet-/window-open) before the
# 'metaworld/' prefix. Those tasks were built as D4RL envs and crashed before
# wandb.init. Fixed on 24.Sep. The first 24.Sep submission still ran the old
# code copy: those 40 runs crashed the same way, and only peg-insert-side seed
# 0 (the 41st run) trains, as W&B run 2qci40m3. So this list is:
#   door-close, door-lock, door-open, door-unlock, drawer-open, faucet-open,
#   hammer, window-open   all five seeds (0, 2, 4, 6, 8)
# They are trained from scratch into the SAME W&B group as the other 210 runs.
# Every other run reached at least 4.94M (the last eval is at 4999999), so none
# of them is repeated.
#
# The group stays, but the scope must NOT: the resume dir is
# <task path>/resume/<scope>/rep_<seed>/model, and under the old scope that is
# where anything the 14.Sep attempt of these runs left behind would sit --
# auto_resume_from_latest_checkpoint would pick it up and continue it. Under this
# new scope every candidate dir is empty (the log_* scan is skipped whenever a
# scope is set), the active-run lock moves with it, and the config fingerprint,
# which hashes the scope, would reject an old checkpoint anyway. With no
# checkpoint there is no stored wandb_run_id either, so every rep opens a NEW W&B
# run in the group. Put the old scope back only to requeue or resume the original
# runs.
#
# (The previous scope bump, to 14.Sep.2026b, was for a different reason:
# MetaWorld's goal-observable env used to be created frozen, so checkpoints from
# before envs/metaworld_utils.py::_unfreeze_task hold a buffer collected on a
# single task instance.)
resume_scope_name: "metaworld_randinit_lastframe_14.Sep.2026b_rerun_24.Sep.2026"

# The seeds come from `list:` below, NOT from seed/repetitions. cw2 treats a
# `seed` entry in a sweep as an explicit seed (conf_unfolder.py: that run gets
# the seed and repetitions=1), so _rep_idx is 0 and main_cw2.py's
# prepare_rep_configs (`seed = seed + _rep_idx`, then rep_<_rep_idx> ->
# rep_<seed>) keeps the seed as written. A run's on-disk identity is its SEED.
#
# Do not reproduce specific seeds with `seed: 0, repetitions: N`. The 14.Sep
# launch wrote `seed: 0, repetitions: 5` and got seeds 0, 2, 4, 6, 8, not 0-4:
# with num_gpus=auto, cw2 persists the already-prepared runtime config
# (cw_slurm.py::_persist_runtime_config) and every job re-reads it, so
# prepare_rep_configs runs a second time on a seed that is already
# base+_rep_idx. With explicit seeds _rep_idx is 0 and both passes agree.
#
# Resubmitting this file is safe: each rep takes an active-run lock under its
# (new-scope) resume dir, and a rep that cannot take it prints "Active run lock
# held ...; skipping duplicate run" and surrenders. A re-run that is interrupted
# resumes from its OWN checkpoint under this scope, and one already at
# `iterations` is skipped.
#
# reps_per_job / reps_in_parallel are placeholders: with num_gpus=auto, cw2
# overwrites BOTH per array task from the node size it assigned (cw2/job.py sets
# REPS_P_JOB and REPS_PARALL from auto_gpu_job_capacities), so a GPUx1 task runs
# 1 rep and a GPUx4 task runs 4.
#
# Keeping this in ONE file matters: `params` below are byte-identical to the
# 14.Sep launch, which is what makes these runs seeds of the same configuration.
# The only addition is the params.seed that cw2 writes for an explicit seed; it
# is only logged into the W&B config, and training reads cw_config['seed'].
seed: 0
repetitions: 1
reps_per_job: 4
reps_in_parallel: 4

# MetaWorld has no offline dataset, so offline_steps must be 0 (pure online).
# iterations = ceil(online_steps / chunk_size) = 5_000_000 / 5_000 = 1000.
iterations: &iterations 1000
num_checkpoints: 100         # a resume checkpoint every iterations/num_checkpoints = 10 chunks
overwrite_checkpoints: true

# Keep this separate from the other projects' result roots: cw2 derives
# `slurm_log` (<path>/slurmlog) and `slurm_output` (<path>/sbatch.sh) from `path`
# (cw_slurm.py:_complete_optionals), so two projects sharing a `path` overwrite
# each other's sbatch.sh on submit and interleave their slurm logs.
path: "/gpfs/petra3/scratch/dongtian/rlac_exp_result"

auto_resume_from_latest_checkpoint: true
resume_dir_name: "resume"

# NOTE: `group` does NOT control the checkpoint lineage while `resume_scope_name`
# above is set. main_cw2.py::_resume_scope_name reads resume_scope_name first and
# only falls back to this group when that key is absent, so renaming the group
# alone would start a new W&B group that RESUMES the old group's checkpoints.
# To really start over, change resume_scope_name too. The 14.Sep launch bumped
# both; this re-run bumps only the scope, on purpose, so that the fresh runs land
# in the original group.
wandb:
  project: "[rlac online]metaworld"
  group: "[rlac] metaworld 50 tasks 5M, randinit+lastframe, 140926b"
  entity: null

params:
  # Task ids stay in this repo's "metaworld/<task>-v2" spelling;
  # envs/metaworld_utils.py normalises them to MetaWorld 3.x's "<task>-v3" and
  # makes them via the "Meta-World/goal_observable" gymnasium id, then unfreezes
  # the task so object and goal are redrawn every reset. The only install needed is:
  #   pip install "git+https://github.com/dongtian-code/Metaworld.git@dt_branch"
  # (fancy_gym is no longer used -- it is stuck on gymnasium 0.29 / mujoco 2.3.3).
  env_name: "metaworld/reach-v2"

  offline_steps: 0            # must stay 0 -- there is no offline data for MetaWorld
  online_steps: 5000000
  buffer_size: 5000000        # full history; ~2 GB per rep, sized for by mem-per-cpu above
  chunk_size: &chunk_size 5000
  log_interval: *chunk_size
  eval_interval: 20000
  save_interval: -1
  start_training: 5000        # random actions until the buffer has this many transitions

  # SimbaV2 runs at updates_per_interaction_step: 2 (its own default). The two
  # methods are matched on ENVIRONMENT SAMPLES (5M steps each), not on gradient
  # steps -- state the UTD alongside any comparison.
  utd_ratio: 1
  discount: 0.99

  eval_episodes: 20
  video_episodes: 0
  video_frame_skip: 3

  # Unused for MetaWorld (no dataset), left at defaults.
  dataset_proportion: 1.0
  dataset_replace_interval: 1000
  ogbench_dataset_dir: null

  horizon_length: 5
  sparse: false
  save_all_online_states: false   # MetaWorld's env has no get_state(); leave this off

  agent:
    actor_type: "best-of-n"
    agent_name: "acfql"
    lr: 0.0003
    batch_size: 256
    actor_num_samples: 32     # only read when actor_type == "best-of-n"

# Zipped element by element: run k trains env_name[k] with seed[k] -- 8 x 5 = 40
# runs. An explicit `seed` in the sweep is excluded from cw2's experiment
# name, so each run keeps the 14.Sep launch's per-task directory and W&B run name
# (<task>_sd<seed>); only the resume scope above differs. The full 50-task grid of
# that launch is in commit ca283c5.
list:
  env_name: [
    "metaworld/door-close-v2", "metaworld/door-close-v2", "metaworld/door-close-v2", "metaworld/door-close-v2", "metaworld/door-close-v2",
    "metaworld/door-lock-v2", "metaworld/door-lock-v2", "metaworld/door-lock-v2", "metaworld/door-lock-v2", "metaworld/door-lock-v2",
    "metaworld/door-open-v2", "metaworld/door-open-v2", "metaworld/door-open-v2", "metaworld/door-open-v2", "metaworld/door-open-v2",
    "metaworld/door-unlock-v2", "metaworld/door-unlock-v2", "metaworld/door-unlock-v2", "metaworld/door-unlock-v2", "metaworld/door-unlock-v2",
    "metaworld/drawer-open-v2", "metaworld/drawer-open-v2", "metaworld/drawer-open-v2", "metaworld/drawer-open-v2", "metaworld/drawer-open-v2",
    "metaworld/faucet-open-v2", "metaworld/faucet-open-v2", "metaworld/faucet-open-v2", "metaworld/faucet-open-v2", "metaworld/faucet-open-v2",
    "metaworld/hammer-v2", "metaworld/hammer-v2", "metaworld/hammer-v2", "metaworld/hammer-v2", "metaworld/hammer-v2",
    "metaworld/window-open-v2", "metaworld/window-open-v2", "metaworld/window-open-v2", "metaworld/window-open-v2", "metaworld/window-open-v2",
  ]
  seed: [
    0, 2, 4, 6, 8,  # door-close-v2
    0, 2, 4, 6, 8,  # door-lock-v2
    0, 2, 4, 6, 8,  # door-open-v2
    0, 2, 4, 6, 8,  # door-unlock-v2
    0, 2, 4, 6, 8,  # drawer-open-v2
    0, 2, 4, 6, 8,  # faucet-open-v2
    0, 2, 4, 6, 8,  # hammer-v2
    0, 2, 4, 6, 8,  # window-open-v2
  ]
