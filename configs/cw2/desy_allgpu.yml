---
name: "SLURM"
partition: "allgpu"
job-name: "RLAC"
num_parallel_jobs: 20
ntasks: 1
cpus-per-task: 8
mem-per-cpu: 8000
time: 1440
#sbatch_args:
#    gres=gpu:1: ""

# Preemption/requeue on this partition: Slurm sends SIGUSR1 5 minutes before the
# hard SIGTERM (`signal: B:USR1@300`), main_cw2.py checkpoints on that and then
# quiesces until the SIGTERM arrives, at which point it surrenders and lets
# `--requeue` restart the same job -- which re-enters `initialize()` and picks
# the checkpoint back up (see `auto_resume_from_latest_checkpoint` below).
preemption_mode: requeue
sbatch_args:
  requeue: ""
  signal: "B:USR1@300"

experiment_copy_src: "../"
experiment_copy_auto_dst: "/path/to/scratch/CODE_COPY/"

---
name: "RLAC"

# cw2 config
repetitions: 4
reps_per_job: 1
reps_in_parallel: 1

# `iterations` must equal ceil((offline_steps + online_steps) / chunk_size) --
# main_cw2.py runs one `chunk_size`-step slice of training per cw2 iteration, so
# this is what makes cw2's iteration count line up with the actual step budget.
# Here: (1_000_000 + 1_000_000) / 5_000 = 400.
iterations: &iterations 400
num_checkpoints: 40          # a resume checkpoint every iterations/num_checkpoints = 10 chunks
overwrite_checkpoints: true  # keep only the latest resume checkpoint on disk, not one file per chunk

path: "/path/to/scratch/rlac_exp_result"

# Auto-resume (requeue-based). See main_cw2.py:prepare_rep_configs /
# RLACExperiment._find_latest_checkpoint for how this is consumed.
auto_resume_from_latest_checkpoint: true
resume_dir_name: "resume"
# resume_scope_name: "my_supplement_2026_09_12"  # bump this to start a fresh
#   resume lineage (e.g. for a resubmitted sweep) without colliding with an
#   older run's checkpoints under the same `path`.

wandb:
  project: "qc"
  group: "cw2_desy_allgpu"
  entity: null

params:
  env_name: "cube-triple-play-singletask-task2-v0"

  offline_steps: 1000000
  online_steps: 1000000
  buffer_size: 2000000
  chunk_size: &chunk_size 5000
  log_interval: *chunk_size
  eval_interval: 100000
  save_interval: -1
  start_training: 5000

  utd_ratio: 1
  discount: 0.99

  eval_episodes: 50
  video_episodes: 0
  video_frame_skip: 3

  dataset_proportion: 1.0
  dataset_replace_interval: 1000
  ogbench_dataset_dir: null

  horizon_length: 5
  sparse: false
  save_all_online_states: false

  # Only overrides need to be listed here -- main_cw2.py loads
  # agents/<agent_name>.py's own get_config() defaults and merges this dict on
  # top (the same way config_flags.DEFINE_config_file does for main.py).
  agent:
    agent_name: "acfql"
    lr: 0.0003
    batch_size: 256

grid:
  agent:
    alpha: [3.0, 10.0, 30.0, 100.0]
